name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Required for npm provenance, which ties each published tarball to the
  # workflow run and commit that produced it.
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Verify before publishing
        run: |
          npm run lint
          npm run build
          npm run typecheck:only
          npm test
          npm run size
          npm run verify:packaging

      # Opens a pull request that bumps versions and writes changelogs when
      # changesets are pending. Publishes when that pull request is merged.
      - name: Create release pull request or publish
        uses: changesets/action@v1
        with:
          publish: npm run release
          version: npm run version
          commit: "Release packages"
          title: "Release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
