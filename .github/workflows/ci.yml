name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a branch makes the previous run's result irrelevant, so cancel
# it rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The development toolchain needs Node 22 or later: pdfjs-dist and the
        # Vite plugin both declare that floor. The published packages support
        # Node 18, which the `floor` job below verifies against the built
        # output rather than against the toolchain.
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build output
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/*/dist
          retention-days: 1

  floor:
    name: Runtime floor on Node ${{ matrix.node }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lowest versions the packages claim to support. A declared floor
        # nobody tests is just a number in a manifest.
        node: [18, 20]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages

      # No install: @inksign/core has zero runtime dependencies, so the built
      # output runs as-is. That is the claim being checked.
      - name: Exercise the built package
        run: node scripts/smoke.mjs

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
